<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play your clone — alan-aumaton</title>

  <!-- chessboard.js (board UI) + jQuery dependency, and chess.js (rules) -->
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <!-- chess.js 0.10.3 vendored locally: UMD build that exposes a global `Chess`.
       (0.13+ is ESM-only and breaks a plain <script> tag with "Unexpected token
       'export'", freezing the page on "Loading…".) -->
  <script src="vendor/chess-0.10.3.min.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; }
    #board { width: 400px; }
    #status { margin-top: 1rem; min-height: 1.4em; }
    .row { display: flex; gap: .5rem; align-items: center; margin: .5rem 0; }
    button { padding: .4rem .8rem; }
  </style>
</head>
<body>
  <h2>Play against your clone</h2>

  <div class="row">
    <label>API: <input id="api" value="http://localhost:8000" size="26" /></label>
  </div>
  <div class="row">
    <button id="new">New game</button>
    <label>You play:
      <select id="side"><option value="w">White</option><option value="b">Black</option></select>
    </label>
  </div>

  <div id="board"></div>
  <div id="status">Loading…</div>

  <script>
    const game = new Chess();
    let board = null;

    const $status = document.getElementById('status');
    const apiBase = () => document.getElementById('api').value.replace(/\/$/, '');
    const humanColor = () => document.getElementById('side').value;

    function setStatus(msg) { $status.textContent = msg; }

    function gameOverText() {
      if (game.in_checkmate()) return 'Checkmate.';
      if (game.in_draw()) return 'Draw.';
      if (game.game_over()) return 'Game over.';
      return '';
    }

    // Ask the server for the clone's reply to the current position.
    async function requestBotMove() {
      if (game.game_over()) { setStatus(gameOverText()); return; }
      setStatus('Clone is thinking…');
      try {
        const res = await fetch(apiBase() + '/move', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fen: game.fen(), temperature: 0 })
        });
        if (!res.ok) { setStatus('Server error ' + res.status + ' (model trained yet?)'); return; }
        const data = await res.json();
        if (!data.move) { setStatus(gameOverText() || 'No move.'); return; }
        // Apply the UCI move (e.g. "g1f3" or "e7e8q") via chess.js.
        game.move({
          from: data.move.slice(0, 2),
          to: data.move.slice(2, 4),
          promotion: data.move.slice(4, 5) || 'q'
        });
        board.position(game.fen());
        setStatus(game.game_over() ? gameOverText()
                                   : 'Clone played ' + data.san + '. Your move.');
      } catch (e) {
        setStatus('Could not reach API at ' + apiBase());
      }
    }

    function onDrop(source, target) {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';   // illegal -> bounce the piece back
      board.position(game.fen());
      window.setTimeout(requestBotMove, 250);
    }

    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      // Only let the human move their own colour.
      return piece[0] === humanColor();
    }

    function newGame() {
      game.reset();
      board.orientation(humanColor() === 'w' ? 'white' : 'black');
      board.position('start');
      if (humanColor() === 'b') { setStatus('Clone moves first…'); requestBotMove(); }
      else setStatus('Your move.');
    }

    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      onDragStart, onDrop,
      onSnapEnd: () => board.position(game.fen()),
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    document.getElementById('new').addEventListener('click', newGame);
    document.getElementById('side').addEventListener('change', newGame);
    setStatus('Your move.');
  </script>
</body>
</html>
